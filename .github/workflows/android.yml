name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build React
      - name: Build Web
        run: npm run build

      # Setup Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Verify Java
      - name: Verify Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync

      # Build APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug 

      # Show generated files
      - name: Show Build Outputs
        run: |
          echo "===== APK ====="
          find android/app/build/outputs/apk -type f || true

          echo "===== AAB ====="
          find android/app/build/outputs/bundle -type f || true

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            android/app/build/outputs/**/*.apk
            android/app/build/outputs/**/*.aab
          if-no-files-found: error