name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js (Node 22 required by Capacitor 7 CLI)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # Build Web Assets (React / Vite)
      - name: Build Web
        run: npm run build

      # Setup Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Verify Java Environment
      - name: Verify Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Add Android Platform if missing & Sync Capacitor
      - name: Add Android Platform & Sync
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android belum ada, membuat platform android dengan Capacitor..."
            npx cap add android
          fi
          echo "Melakukan sync file web ke project Android..."
          npx cap sync android

      # Build Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Show generated outputs
      - name: Show Build Outputs
        run: |
          echo "===== APK ====="
          find android/app/build/outputs/apk -type f || true

          echo "===== AAB ====="
          find android/app/build/outputs/bundle -type f || true

      # Upload APK & AAB Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
