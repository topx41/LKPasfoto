name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js (Node 22 required by Capacitor 7 CLI)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # Build Web Assets (React / Vite)
      - name: Build Web
        run: npm run build

      # Setup Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Verify Java Environment
      - name: Verify Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Add Android Platform if missing & Sync Capacitor
      - name: Add Android Platform & Sync
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android belum ada, membuat platform android dengan Capacitor..."
            npx cap add android
          fi

          # Inject Intent Filter into AndroidManifest.xml so app appears in Android Share Sheet
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ] && ! grep -q "android.intent.action.SEND" "$MANIFEST_FILE"; then
            echo "Injecting Android Share Intent Filter into AndroidManifest.xml..."
            cat << 'EOF' > inject_intent.js
            const fs = require('fs');
            const manifestPath = 'android/app/src/main/AndroidManifest.xml';
            if (fs.existsSync(manifestPath)) {
              let content = fs.readFileSync(manifestPath, 'utf-8');
              if (!content.includes('android.intent.action.SEND')) {
                const shareIntent = `
            <!-- Register app in Android System Share Sheet for Excel & CSV Files -->
            <intent-filter>
                <action android:name="android.intent.action.SEND" />
                <action android:name="android.intent.action.SEND_MULTIPLE" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                <data android:mimeType="application/vnd.ms-excel" />
                <data android:mimeType="text/csv" />
                <data android:mimeType="text/comma-separated-values" />
                <data android:mimeType="application/csv" />
                <data android:mimeType="application/excel" />
                <data android:mimeType="*/*" />
            </intent-filter>`;
                content = content.replace('</activity>', shareIntent + '\n        </activity>');
                fs.writeFileSync(manifestPath, content, 'utf-8');
                console.log('Successfully injected Share Intent Filter!');
              }
            }
            EOF
            node inject_intent.js
            rm -f inject_intent.js
          fi

          echo "Melakukan sync file web ke project Android..."
          npx cap sync android

      # Build Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Show generated outputs
      - name: Show Build Outputs
        run: |
          echo "===== APK ====="
          find android/app/build/outputs/apk -type f || true

          echo "===== AAB ====="
          find android/app/build/outputs/bundle -type f || true

      # Upload APK & AAB Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
