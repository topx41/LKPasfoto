name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js (Node 22 required by Capacitor 7 CLI)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # Build Web Assets (React / Vite)
      - name: Build Web
        run: npm run build

      # Setup Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Verify Java Environment
      - name: Verify Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Add Android Platform if missing & Sync Capacitor
      - name: Add Android Platform & Sync
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android belum ada, membuat platform android dengan Capacitor..."
            npx cap add android
          fi

          # Inject Intent Filter into AndroidManifest.xml so app appears in Android Share Sheet
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ] && ! grep -q "android.intent.action.SEND" "$MANIFEST_FILE"; then
            echo "Injecting Android Share Intent Filter into AndroidManifest.xml..."
