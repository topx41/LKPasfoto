name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application (React / Vite)
        run: npm run build

      - name: Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache & Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android belum ada, menambahkan platform Android..."
            npx cap add android
          fi

          echo "Melakukan sync web assets ke project Android..."
          npx cap sync android

      - name: Ensure Valid Gradle Wrapper JAR
        run: |
          cd android
          if ! java -jar gradle/wrapper/gradle-wrapper.jar --version >/dev/null 2>&1; then
            echo "⚠️ gradle-wrapper.jar corrupt! Downloading clean binary gradle-wrapper.jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar || true
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show Generated Build Artifacts
        run: |
          echo "===== Generated APK Files ====="
          find android/app/build/outputs/apk -type f || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liankhay-Capture-Android-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

