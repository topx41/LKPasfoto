<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Outer Ring Metallic Gradient -->
    <linearGradient id="metallicRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <linearGradient id="lensGlass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>

    <!-- Aperture Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#metallicRing)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Camera Body & Lens Assembly -->
  <g filter="url(#softShadow)" transform="translate(0, 0)">
    <!-- Outer Lens Ring -->
    <circle cx="256" cy="256" r="180" fill="#0f172a" stroke="url(#metallicRing)" stroke-width="12" />
    <circle cx="256" cy="256" r="150" fill="#020617" stroke="#1e293b" stroke-width="8" />

    <!-- Aperture Blades Blades Accent -->
    <g stroke="url(#metallicRing)" stroke-width="3" opacity="0.6">
      <line x1="256" y1="116" x2="200" y2="210" />
      <line x1="396" y1="256" x2="302" y2="200" />
      <line x1="326" y1="377" x2="270" y2="283" />
      <line x1="116" y1="256" x2="210" y2="312" />
      <line x1="186" y1="135" x2="242" y2="229" />
    </g>

    <!-- Core Lens Inner Circle -->
    <circle cx="256" cy="256" r="110" fill="url(#lensGlass)" filter="url(#glow)" />
    <circle cx="256" cy="256" r="75" fill="#020617" opacity="0.75" />

    <!-- Center Sensor Reflection -->
    <circle cx="256" cy="256" r="45" fill="url(#metallicRing)" opacity="0.85" />
    <circle cx="235" cy="235" r="18" fill="#ffffff" opacity="0.75" />

    <!-- Top Right Flash / Studio LED Indicator -->
    <circle cx="390" cy="122" r="18" fill="#10b981" filter="url(#glow)" />
    <circle cx="390" cy="122" r="8" fill="#ffffff" />
  </g>

  <!-- Excel Data Overlay Badge (Bottom Right) -->
  <g transform="translate(320, 320)" filter="url(#softShadow)">
    <rect width="130" height="130" rx="28" fill="#020617" stroke="#10b981" stroke-width="5" />
    <path d="M35 30 L95 30 L95 100 L35 100 Z" fill="none" stroke="#34d399" stroke-width="6" stroke-linejoin="round" />
    <!-- Grid Lines -->
    <line x1="35" y1="52" x2="95" y2="52" stroke="#34d399" stroke-width="4" />
    <line x1="35" y1="74" x2="95" y2="74" stroke="#34d399" stroke-width="4" />
    <line x1="65" y1="30" x2="65" y2="100" stroke="#34d399" stroke-width="4" />
  </g>
</svg>
