<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f224a" />
      <stop offset="60%" stop-color="#071226" />
      <stop offset="100%" stop-color="#020611" />
    </radialGradient>

    <!-- Glowing Blue Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#0033cc" />
    </linearGradient>

    <!-- Camera Body Metallic Gradient -->
    <linearGradient id="cameraBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3b5c" />
      <stop offset="30%" stop-color="#18253d" />
      <stop offset="100%" stop-color="#0a1220" />
    </linearGradient>

    <!-- Camera Top Bump Gradient -->
    <linearGradient id="cameraTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b4e75" />
      <stop offset="100%" stop-color="#18253d" />
    </linearGradient>

    <!-- Lens Outer Metallic Bezel -->
    <linearGradient id="lensBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="30%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Lens Core Deep Glass Gradient -->
    <radialGradient id="lensCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#1d4ed8" />
      <stop offset="55%" stop-color="#6d28d9" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Document Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Paper Fold Corner Shadow -->
    <linearGradient id="foldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Container (Navy Blue Rounded Square) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Ambient Lighting/Highlight border -->
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-opacity="0.4" />

  <!-- SCALED INNER GRAPHIC SAFE-ZONE (84% Scale for Perfect Safe Margins on All Launcher Masks) -->
  <g transform="translate(256, 256) scale(0.84) translate(-256, -256)">
    <!-- Glowing Blue Arc Framing Center Elements -->
    <g filter="url(#arcGlow)">
      <path d="M 125,230 A 155,155 0 1,1 387,230" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9" />
      <path d="M 390,265 A 155,155 0 0,1 122,265" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- DOCUMENT SHEET (PAPER) -->
    <g filter="url(#dropShadow)">
      <!-- Main Paper Body with Top-Right Fold -->
      <path d="M 152,70 L 312,70 L 360,118 L 360,300 C 360,306.6 354.6,312 348,312 L 164,312 C 157.4,312 152,306.6 152,300 Z" fill="url(#paperGrad)" />
      
      <!-- Paper Fold Triangle -->
      <path d="M 312,70 L 312,110 C 312,114.4 315.6,118 320,118 L 360,118 Z" fill="url(#foldGrad)" />

      <!-- Document Content ("LOG" + Lines with bullets) -->
      <text x="182" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#0f172a" letter-spacing="1">LOG</text>
      
      <!-- Bullet 1 -->
      <circle cx="186" cy="142" r="5" fill="#1d4ed8" />
      <rect x="202" y="139" width="105" height="6" rx="3" fill="#64748b" />
      
      <!-- Bullet 2 -->
      <circle cx="186" cy="162" r="5" fill="#1d4ed8" />
      <rect x="202" y="159" width="128" height="6" rx="3" fill="#64748b" />
      
      <!-- Bullet 3 -->
      <circle cx="186" cy="182" r="5" fill="#1d4ed8" />
      <rect x="202" y="179" width="85" height="6" rx="3" fill="#64748b" />
    </g>

    <!-- CAMERA ASSEMBLY (IN FRONT OF DOCUMENT) -->
    <g filter="url(#dropShadow)">
      <!-- Red Shutter Button (Top-Left) -->
      <rect x="156" y="162" width="40" height="14" rx="6" fill="#f04438" />
      <rect x="160" y="162" width="32" height="4" rx="2" fill="#fca5a5" opacity="0.6" />

      <!-- Camera Top Viewfinder Bump -->
      <path d="M 204,170 C 204,162 210,156 218,156 L 294,156 C 302,156 308,162 308,170 L 322,180 L 190,180 Z" fill="url(#cameraTop)" />

      <!-- Main Camera Body -->
      <rect x="124" y="178" width="264" height="152" rx="28" fill="url(#cameraBody)" stroke="#334155" stroke-width="2" />
      
      <!-- Top Metallic Accent Line on Camera Body -->
      <line x1="140" y1="182" x2="372" y2="182" stroke="#64748b" stroke-width="2" opacity="0.5" />

      <!-- Front Left Cyan LED Light -->
      <circle cx="154" cy="206" r="6" fill="#00f0ff" filter="url(#cyanGlow)" />
      <circle cx="154" cy="206" r="3" fill="#ffffff" />

      <!-- LENS ASSEMBLY (CENTER) -->
      <!-- Outer Metallic Bezel Ring -->
      <circle cx="256" cy="254" r="72" fill="url(#lensBezel)" stroke="#020617" stroke-width="3" />
      <circle cx="256" cy="254" r="63" fill="#090d16" stroke="#1e293b" stroke-width="2" />
      
      <!-- Lens Inner Ridges / Grooves -->
      <circle cx="256" cy="254" r="56" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6,3" opacity="0.6" />

      <!-- Lens Glass Core (Vibrant Blue/Purple Radial Gradient) -->
      <circle cx="256" cy="254" r="48" fill="url(#lensCore)" />

      <!-- Aperture Blade Details -->
      <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
        <line x1="256" y1="210" x2="230" y2="240" />
        <line x1="298" y1="240" x2="265" y2="225" />
        <line x1="285" y1="290" x2="270" y2="260" />
        <line x1="214" y1="268" x2="247" y2="283" />
        <line x1="227" y1="218" x2="242" y2="248" />
      </g>

      <!-- Lens Specular Highlights (Glass Reflections) -->
      <!-- Main Top-Left Specular Curved Reflection -->
      <path d="M 226,230 A 34,34 0 0,1 276,226 A 38,38 0 0,0 232,246 Z" fill="#ffffff" opacity="0.75" />
      <!-- Secondary Small Bottom-Right Specular Dot -->
      <circle cx="280" cy="278" r="5" fill="#38bdf8" opacity="0.85" />
      <circle cx="282" cy="280" r="2" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- BOTTOM BRANDING TEXT -->
    <!-- "Liankhay" Text -->
    <text x="256" y="424" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-0.5">Liankhay</text>

    <!-- "CAPTURE LOG" Text -->
    <text x="256" y="458" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="21" fill="#38bdf8" letter-spacing="5">CAPTURE LOG</text>
  </g>
</svg>
